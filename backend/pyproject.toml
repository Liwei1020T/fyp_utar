[project]
name = "stringsense-backend"
version = "0.1.0"
description = "StringSense unified Python backend workspace with in-process AI services"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.139.2",
  "alembic>=1.18.5",
  "PyJWT>=2.13.0",
  "pydantic-settings>=2.14.2",
  "psycopg[binary]>=3.2.0",
  "python-multipart>=0.0.32",
  "sqlalchemy>=2.0.0",
  "uvicorn>=0.51.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.0.0",
  "mypy>=1.16.0",
  "pytest>=9.1.1",
  "ruff>=0.15.8,<0.15.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [
  ".venv",
  ".pytest_cache",
  ".ruff_cache",
  "__pycache__",
  "stringsense_backend.egg-info",
  "**/._*",
  "**/.__*",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
